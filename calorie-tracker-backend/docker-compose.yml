name: calorie-tracker-backend

x-java-service: &java-service
  restart: unless-stopped
  read_only: true
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=128m,mode=1777
  networks:
    - backend

services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3.13.7-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?Set RABBITMQ_USERNAME in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - backend
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  pdf-volume-init:
    image: alpine:3.22
    restart: "no"
    command: ["sh", "-c", "chown 10001:10001 /pdf-imports && chmod 700 /pdf-imports"]
    volumes:
      - pdf-import-data:/pdf-imports
    network_mode: none
    security_opt:
      - no-new-privileges:true

  identity-service:
    <<: *java-service
    image: calorie-tracker-identity-service:local
    build:
      context: .
      dockerfile: Dockerfile
      target: identity-service-runtime
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_ADDRESS: 0.0.0.0
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      DB_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    depends_on:
      postgres:
        condition: service_healthy

  core-service:
    <<: *java-service
    image: calorie-tracker-core-service:local
    build:
      context: .
      dockerfile: Dockerfile
      target: core-service-runtime
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_ADDRESS: 0.0.0.0
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      DB_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?Set RABBITMQ_USERNAME in .env}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in .env}
      PDF_IMPORT_DIR: /var/lib/calorie-tracker/pdf-imports
    volumes:
      - pdf-import-data:/var/lib/calorie-tracker/pdf-imports
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      pdf-volume-init:
        condition: service_completed_successfully

  ai-service:
    <<: *java-service
    image: calorie-tracker-ai-service:local
    build:
      context: .
      dockerfile: Dockerfile
      target: ai-service-runtime
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_ADDRESS: 0.0.0.0
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?Set RABBITMQ_USERNAME in .env}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in .env}
      CORE_SERVICE_BASE_URL: http://core-service:9082
      PDF_IMPORT_DIR: /var/lib/calorie-tracker/pdf-imports
    volumes:
      - pdf-import-data:/var/lib/calorie-tracker/pdf-imports
    networks:
      - backend
      - egress
    depends_on:
      rabbitmq:
        condition: service_healthy
      core-service:
        condition: service_started
      pdf-volume-init:
        condition: service_completed_successfully

  api-gateway:
    <<: *java-service
    image: calorie-tracker-api-gateway:local
    build:
      context: .
      dockerfile: Dockerfile
      target: api-gateway-runtime
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_ADDRESS: 0.0.0.0
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in .env}
      IDENTITY_SERVICE_URL: http://identity-service:9081
      CORE_SERVICE_URL: http://core-service:9082
      AI_SERVICE_URL: http://ai-service:9083
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3010,http://127.0.0.1:3010}
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-9080}:9080"
    networks:
      - backend
      - edge
    depends_on:
      identity-service:
        condition: service_started
      core-service:
        condition: service_started
      ai-service:
        condition: service_started

  frontend:
    build:
      context: ../calorie-tracker-frontend
      dockerfile: Dockerfile
      args:
        API_GATEWAY_URL: http://api-gateway:9080
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      API_GATEWAY_URL: http://api-gateway:9080
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3010}:3000"
    networks:
      - edge
    depends_on:
      api-gateway:
        condition: service_started

volumes:
  postgres-data:
  rabbitmq-data:
  pdf-import-data:

networks:
  backend:
    internal: true
  edge:
  egress:
