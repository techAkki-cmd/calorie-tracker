server:
  port: 9083

spring:
  profiles:
    default: dev
  application:
    name: ai-service
  rabbitmq:
    listener:
      simple:
        default-requeue-rejected: false
    host: localhost
    port: 9672
    username: calorie_user
    password: calorie_pass
  servlet:
    multipart:
      # The 1MB default rejects almost every phone photo.
      max-file-size: 10MB
      max-request-size: 10MB

gemini:
  api:
    key: ${GEMINI_API_KEY}
  # 2.0-flash was shut down June 2026; 2.5-flash 404s generateContent for many new keys.
  model: gemini-3.6-flash
  base-url: https://generativelanguage.googleapis.com

pdf:
  import-dir: ${PDF_IMPORT_DIR:${java.io.tmpdir}/calorie-tracker-pdfs}

core-service:
  base-url: http://localhost:9082
