server:
  port: 9083

spring:
  application:
    name: ai-service
  rabbitmq:
    host: localhost
    port: 9672
    username: calorie_user
    password: calorie_pass
  servlet:
    multipart:
      # The 1MB default rejects almost every phone photo.
      max-file-size: 10MB
      max-request-size: 10MB

gemini:
  api:
    key: ${GEMINI_API_KEY}
  model: gemini-2.5-flash
  base-url: https://generativelanguage.googleapis.com/v1beta
