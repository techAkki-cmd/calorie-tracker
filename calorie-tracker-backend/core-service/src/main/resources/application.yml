server:
  port: 9082

spring:
  profiles:
    default: dev
  application:
    name: core-service
  datasource:
    url: jdbc:postgresql://localhost:9432/calorie_tracker
    username: calorie_user
    password: calorie_pass
    driver-class-name: org.postgresql.Driver
  rabbitmq:
    host: localhost
    port: 9672
    username: calorie_user
    password: calorie_pass
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

pdf:
  import-dir: ${PDF_IMPORT_DIR:${java.io.tmpdir}/calorie-tracker-pdfs}
