server:
  port: 9080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-service
              uri: http://localhost:9081
              predicates:
                - Path=/api/auth/**,/api/users/**
            - id: core-service
              uri: http://localhost:9082
              predicates:
                - Path=/api/goals/**,/api/meals/**,/api/foods/**,/api/analytics/**
            - id: ai-service
              uri: http://localhost:9083
              predicates:
                - Path=/api/ai/**
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:3000"
                  - "http://localhost:3001"
                  - "http://localhost:3002"
                  - "http://localhost:3010"
                  - "http://localhost:3011"
                  - "http://localhost:3012"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: true

jwt:
  secret: ${JWT_SECRET}
