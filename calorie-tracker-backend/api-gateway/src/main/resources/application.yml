server:
  port: 9080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-service
              uri: ${IDENTITY_SERVICE_URL}
              predicates:
                - Path=/api/auth/**
            - id: core-service
              uri: ${CORE_SERVICE_URL}
              predicates:
                - Path=/api/goals/**,/api/meals/**,/api/analytics/**,/api/weight/**
            - id: ai-service
              uri: ${AI_SERVICE_URL}
              predicates:
                - Path=/api/ai/**
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: ${CORS_ALLOWED_ORIGINS}
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: true

jwt:
  secret: ${JWT_SECRET}
