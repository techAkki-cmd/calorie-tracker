server:
  port: 9080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-service
              uri: http://localhost:9081
              predicates:
                - Path=/api/auth/**,/api/users/**
            - id: core-service
              uri: http://localhost:9082
              predicates:
                - Path=/api/goals/**,/api/meals/**,/api/foods/**
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "http://localhost:3000"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: true

jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me-at-least-32-bytes-long}
